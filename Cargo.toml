[package]
name = "fleetcheck"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fleetcheck"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_pcg = "0.3"
anyhow = "1"
csv = "1"
threadpool = "1.8"

[profile.release]
opt-level = 2
