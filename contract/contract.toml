# Declared host contract: this is the "known good" state every host in the fleet is asserted
# against. Kernel tuning and systemd unit set are shared across distributions; package names
# and versions differ (apt vs. rpm naming).

ports = [22, 9100]

[kernel]
"net.ipv4.ip_forward" = "0"
"vm.swappiness" = "10"

[packages.ubuntu]
openssh-server = "1:8.9p1-3ubuntu0.17"
chrony = "4.2-2ubuntu2"
auditd = "1:3.0.6-2.1ubuntu1.1"

[packages.rhel]
openssh-server = "8.7p1-34.el9_3"
chrony = "4.3-1.el9"
audit = "3.1.2-2.el9"

[units]
sshd = "active"
chronyd = "active"
node_exporter = "active"
